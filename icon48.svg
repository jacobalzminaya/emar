<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#3ecfff"/>
      <stop offset="45%"  stop-color="#1a9fe8"/>
      <stop offset="100%" stop-color="#0a4fa8"/>
    </radialGradient>
    <radialGradient id="ring" cx="36%" cy="30%" r="62%">
      <stop offset="0%"   stop-color="#e8f8ff"/>
      <stop offset="35%"  stop-color="#8dd6f7"/>
      <stop offset="70%"  stop-color="#2a8fd4"/>
      <stop offset="100%" stop-color="#0f52a0"/>
    </radialGradient>
    <radialGradient id="letter" cx="38%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#d4f2ff"/>
      <stop offset="100%" stop-color="#90d4f5"/>
    </radialGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#072050" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="24" cy="24" r="22" fill="url(#bg)" filter="url(#sh)"/>
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#ring)" stroke-width="2.8"/>
  <circle cx="24" cy="24" r="20.2" fill="none" stroke="#7dd4f5" stroke-width="0.6" opacity="0.45"/>

  <line x1="24" y1="24" x2="42" y2="13.5" stroke="#1565c0" stroke-width="0.5" opacity="0.3"/>
  <line x1="24" y1="24" x2="42" y2="34.5" stroke="#1565c0" stroke-width="0.5" opacity="0.3"/>
  <line x1="24" y1="24" x2="6"  y2="24"   stroke="#1565c0" stroke-width="0.5" opacity="0.3"/>

  <path d="M 9 11 A 22 22 0 0 1 30 2.5" stroke="#ddf3ff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 10 12 A 21 21 0 0 1 29 3.5" stroke="#ffffff" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.5"/>

  <ellipse cx="19" cy="16" rx="11" ry="6.5" fill="#ffffff" opacity="0.10"/>

  <!-- J&E en tamaño compacto para caber en el círculo -->
  <text x="24" y="30"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="15"
    font-weight="700"
    text-anchor="middle"
    fill="url(#letter)"
    letter-spacing="-0.5">J&amp;E</text>
</svg>
